<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b0a"/>
      <stop offset="1" stop-color="#1a110c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2591d"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="52" fill="#ede6dc" font-size="24" font-weight="700">How Money Check works</text>
  <text x="40" y="80" fill="#a59a90" font-size="15">Your agent runs locally. Money Check controls the world around it, then grades the money against an independent ledger.</text>

  <!-- Agent -->
  <rect x="40" y="120" width="230" height="190" rx="16" fill="#171310" stroke="#3a2f28"/>
  <text x="62" y="156" fill="#ede6dc" font-size="19" font-weight="700">Your agent</text>
  <text x="62" y="186" fill="#a59a90" font-size="14">Any language, any model</text>
  <text x="62" y="214" fill="#a59a90" font-size="14">TypeScript / Python helper</text>
  <text x="62" y="242" fill="#a59a90" font-size="14">Sees only the task, its</text>
  <text x="62" y="262" fill="#a59a90" font-size="14">mandate and tool replies</text>
  <text x="62" y="292" fill="#f2591d" font-size="13" font-family="IBM Plex Mono, Consolas, monospace">pay · status · wait</text>

  <line x1="272" y1="215" x2="342" y2="215" stroke="#f2591d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="342" y1="245" x2="272" y2="245" stroke="#6b5d52" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="205" fill="#a59a90" font-size="12">actions</text>
  <text x="282" y="268" fill="#a59a90" font-size="12">replies</text>

  <!-- Simulator -->
  <rect x="345" y="120" width="300" height="190" rx="16" fill="#1d1511" stroke="#f2591d" stroke-opacity="0.55"/>
  <text x="367" y="156" fill="#ede6dc" font-size="19" font-weight="700">Simulated world</text>
  <text x="367" y="184" fill="#a59a90" font-size="14">Deterministic ledger, seeded faults:</text>
  <g font-size="13" font-family="IBM Plex Mono, Consolas, monospace" fill="#ede6dc">
    <rect x="367" y="198" width="118" height="26" rx="13" fill="#2a1d16"/><text x="379" y="216">timeout</text>
    <rect x="492" y="198" width="132" height="26" rx="13" fill="#2a1d16"/><text x="504" y="216">false success</text>
    <rect x="367" y="232" width="150" height="26" rx="13" fill="#2a1d16"/><text x="379" y="250">look-alike payee</text>
    <rect x="524" y="232" width="100" height="26" rx="13" fill="#2a1d16"/><text x="536" y="250">late land</text>
    <rect x="367" y="266" width="128" height="26" rx="13" fill="#2a1d16"/><text x="379" y="284">crash, restart</text>
    <rect x="502" y="266" width="122" height="26" rx="13" fill="#2a1d16"/><text x="514" y="284">budget split</text>
  </g>

  <line x1="647" y1="215" x2="717" y2="215" stroke="#f2591d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="652" y="205" fill="#a59a90" font-size="12">evidence</text>

  <!-- Grader -->
  <rect x="720" y="120" width="210" height="190" rx="16" fill="#171310" stroke="#3a2f28"/>
  <text x="742" y="156" fill="#ede6dc" font-size="19" font-weight="700">Grader</text>
  <text x="742" y="184" fill="#a59a90" font-size="14">14 fixed money rules</text>
  <text x="742" y="208" fill="#a59a90" font-size="14">Claims vs what settled</text>
  <text x="742" y="232" fill="#a59a90" font-size="14">Hash-chained evidence</text>
  <g font-size="14" font-weight="700">
    <text x="742" y="266" fill="#4ade80">PASS</text>
    <text x="795" y="266" fill="#f87171">FAIL</text>
    <text x="742" y="290" fill="#fbbf24">NOT ESTABLISHED</text>
  </g>

  <line x1="932" y1="215" x2="1002" y2="215" stroke="#f2591d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Outputs -->
  <rect x="1005" y="120" width="155" height="190" rx="16" fill="#171310" stroke="#3a2f28"/>
  <text x="1025" y="156" fill="#ede6dc" font-size="19" font-weight="700">Outputs</text>
  <g fill="#a59a90" font-size="14">
    <text x="1025" y="186">summary.md</text>
    <text x="1025" y="210">SARIF alerts</text>
    <text x="1025" y="234">JUnit</text>
    <text x="1025" y="258">badge</text>
    <text x="1025" y="282">offline replay</text>
  </g>

  <text x="40" y="360" fill="#ede6dc" font-size="16" font-weight="600">No real money. No network. No account.</text>
  <text x="40" y="388" fill="#a59a90" font-size="14">A rule passes only when every scenario behind it passes. Anything that could not be established is shown, never counted as a pass.</text>
</svg>
