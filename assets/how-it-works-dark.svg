<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 484" width="880" height="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img"><title>Your agent acts in a simulated world with seeded faults; a grader compares its claims with the ledger and writes reports</title><style></style><line x1="40" x2="40" y1="52.0" y2="432.0" stroke="#ff6a2b" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 5"/><rect x="76.0" y="1.0" width="803.0" height="104.0" rx="12" fill="#151b23" stroke="#3d444d" stroke-opacity="1"/><circle cx="40" cy="53.0" r="17" fill="#10151c" stroke="#ff6a2b" stroke-width="2"/><text x="40.0" y="59.0" font-size="16" fill="#ff6a2b" font-weight="800" text-anchor="middle">1</text><text x="100.0" y="37.0" font-size="18.5" fill="#f0f6fc" font-weight="750" text-anchor="start">Your agent</text><text x="100.0" y="63.0" font-size="14.5" fill="#9198a1" font-weight="400" text-anchor="start">Runs as it is: any language, any model. It sees only its</text><text x="100.0" y="83.0" font-size="14.5" fill="#9198a1" font-weight="400" text-anchor="start">task, its mandate and the replies from its tools.</text><rect x="612.0" y="39.0" width="62.0" height="28" rx="14" fill="#262c36"/><text x="643.0" y="57.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">action</text><rect x="682.0" y="39.0" width="62.0" height="28" rx="14" fill="#262c36"/><text x="713.0" y="57.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">status</text><rect x="752.0" y="39.0" width="48.0" height="28" rx="14" fill="#262c36"/><text x="776.0" y="57.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">wait</text><rect x="808.0" y="39.0" width="48.0" height="28" rx="14" fill="#262c36"/><text x="832.0" y="57.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">task</text><rect x="76.0" y="127.0" width="803.0" height="104.0" rx="12" fill="#151b23" stroke="#ff6a2b" stroke-opacity="0.65"/><circle cx="40" cy="179.0" r="17" fill="#10151c" stroke="#ff6a2b" stroke-width="2"/><text x="40.0" y="185.0" font-size="16" fill="#ff6a2b" font-weight="800" text-anchor="middle">2</text><text x="100.0" y="163.0" font-size="18.5" fill="#f0f6fc" font-weight="750" text-anchor="start">Simulated world</text><text x="100.0" y="189.0" font-size="14.5" fill="#9198a1" font-weight="400" text-anchor="start">A deterministic ledger with</text><text x="100.0" y="209.0" font-size="14.5" fill="#9198a1" font-weight="400" text-anchor="start">seeded faults, same every run.</text><rect x="395.0" y="147.0" width="69.0" height="28" rx="14" fill="#262c36"/><text x="429.5" y="165.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">timeout</text><rect x="472.0" y="147.0" width="111.0" height="28" rx="14" fill="#262c36"/><text x="527.5" y="165.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">false success</text><rect x="591.0" y="147.0" width="132.0" height="28" rx="14" fill="#262c36"/><text x="657.0" y="165.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">look-alike payee</text><rect x="731.0" y="147.0" width="125.0" height="28" rx="14" fill="#262c36"/><text x="793.5" y="165.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">late settlement</text><rect x="626.0" y="183.0" width="118.0" height="28" rx="14" fill="#262c36"/><text x="685.0" y="201.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">crash, restart</text><rect x="752.0" y="183.0" width="104.0" height="28" rx="14" fill="#262c36"/><text x="804.0" y="201.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">budget split</text><rect x="76.0" y="253.0" width="803.0" height="104.0" rx="12" fill="#151b23" stroke="#3d444d" stroke-opacity="1"/><circle cx="40" cy="305.0" r="17" fill="#10151c" stroke="#ff6a2b" stroke-width="2"/><text x="40.0" y="311.0" font-size="16" fill="#ff6a2b" font-weight="800" text-anchor="middle">3</text><text x="100.0" y="289.0" font-size="18.5" fill="#f0f6fc" font-weight="750" text-anchor="start">Grader</text><text x="100.0" y="315.0" font-size="14.5" fill="#9198a1" font-weight="400" text-anchor="start">14 fixed money rules compare what the agent</text><text x="100.0" y="335.0" font-size="14.5" fill="#9198a1" font-weight="400" text-anchor="start">claimed with what actually settled.</text><rect x="634.0" y="294.0" width="47.0" height="22" rx="11.0" fill="none" stroke="#3fb950" stroke-opacity="0.6"/><text x="657.5" y="309.0" font-size="11" fill="#3fb950" font-weight="700" text-anchor="middle">PASS</text><rect x="689.0" y="294.0" width="43.0" height="22" rx="11.0" fill="none" stroke="#f85149" stroke-opacity="0.6"/><text x="710.5" y="309.0" font-size="11" fill="#f85149" font-weight="700" text-anchor="middle">FAIL</text><rect x="740.0" y="294.0" width="116.0" height="22" rx="11.0" fill="none" stroke="#d29922" stroke-opacity="0.6"/><text x="798.0" y="309.0" font-size="11" fill="#d29922" font-weight="700" text-anchor="middle">NOT ESTABLISHED</text><rect x="76.0" y="379.0" width="803.0" height="104.0" rx="12" fill="#151b23" stroke="#3d444d" stroke-opacity="1"/><circle cx="40" cy="431.0" r="17" fill="#10151c" stroke="#ff6a2b" stroke-width="2"/><text x="40.0" y="437.0" font-size="16" fill="#ff6a2b" font-weight="800" text-anchor="middle">4</text><text x="100.0" y="415.0" font-size="18.5" fill="#f0f6fc" font-weight="750" text-anchor="start">Reports</text><text x="100.0" y="441.0" font-size="14.5" fill="#9198a1" font-weight="400" text-anchor="start">For people and for CI, with hash-chained</text><text x="100.0" y="461.0" font-size="14.5" fill="#9198a1" font-weight="400" text-anchor="start">evidence you can replay offline.</text><rect x="521.0" y="417.0" width="90.0" height="28" rx="14" fill="#262c36"/><text x="566.0" y="435.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">summary.md</text><rect x="619.0" y="417.0" width="55.0" height="28" rx="14" fill="#262c36"/><text x="646.5" y="435.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">SARIF</text><rect x="682.0" y="417.0" width="55.0" height="28" rx="14" fill="#262c36"/><text x="709.5" y="435.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">JUnit</text><rect x="745.0" y="417.0" width="55.0" height="28" rx="14" fill="#262c36"/><text x="772.5" y="435.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">badge</text><rect x="808.0" y="417.0" width="48.0" height="28" rx="14" fill="#262c36"/><text x="832.0" y="435.5" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">JSON</text></svg>
